<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Prophet VS Decoder UI</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f5f5f4;
        --card: #ffffff;
        --border: #d0d7de;
        --text: #1f2937;
        --muted: #4b5563;
        --accent: #d97706;
        --accent-soft: #fff7ed;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .page {
        max-width: 1100px;
        margin: 40px auto;
        padding: 0 20px 40px;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 28px;
      }

      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 20px;
        box-shadow: 0 2px 10px rgba(15, 23, 42, 0.04);
      }

      .controls {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 14px;
        margin: 16px 0 20px;
      }

      .source-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
        grid-column: 1 / -1;
      }

      .source-row > .source-box {
        flex: 1 1 200px;
      }

      .source-row .or {
        font-size: 12px;
        font-weight: 700;
        color: var(--muted);
        text-transform: uppercase;
      }

      label {
        display: block;
        font-size: 12px;
        font-weight: 600;
        color: var(--muted);
        margin-bottom: 6px;
      }

      input[type="file"],
      input[type="number"] {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px 12px;
        font-size: 14px;
        background: white;
      }

      .button-row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin: 12px 0 20px;
      }

      button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: none;
        border-radius: 8px;
        padding: 10px 16px;
        background: var(--accent);
        color: white;
        font-weight: 600;
        cursor: pointer;
      }

      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      button.secondary {
        background: #111827;
      }

      button:hover:not(:disabled) {
        filter: brightness(0.96);
      }

      .status {
        min-height: 24px;
        margin: 0 0 20px;
        color: var(--muted);
        font-size: 14px;
      }

      .results {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 16px;
      }

      .wave-item {
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px;
        background: linear-gradient(#fff, #fffdf9);
      }

      .wave-header {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        margin-bottom: 8px;
      }

      .wave-plot {
        background: var(--accent-soft);
        border-radius: 8px;
        border: 1px solid #f1d7a8;
        overflow: hidden;
      }

      .wave-meta {
        margin-top: 8px;
        font-size: 11px;
        color: var(--muted);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }

    </style>
  </head>
  <body>
    <div class="page">
      <h1>Prophet VS ROM decoder</h1>

      <div class="card">
        <div class="controls">
          <div class="source-row">
            <div class="source-box">
              <label for="msb-file">MSB ROM image</label>
              <input id="msb-file" type="file" accept=".bin,.rom,.dat" />
            </div>

            <div class="source-box">
              <label for="lsb-file">LSB ROM image</label>
              <input id="lsb-file" type="file" accept=".bin,.rom,.dat" />
            </div>

            <div class="or">OR</div>

            <div class="source-box">
              <label for="vswave-file">VS-WAVES.DAT</label>
              <input id="vswave-file" type="file" accept=".bin,.rom,.dat,.wav" />
            </div>
          </div>

          <div>
            <label for="start-index">Waveform start</label>
            <input id="start-index" type="number" min="32" max="125" value="32" />
          </div>

          <div>
            <label for="count">Waveform count</label>
            <input id="count" type="number" min="1" max="94" value="94" />
          </div>

          <div>
            <label for="bit-depth">Bit depth</label>
            <select id="bit-depth" style="width:100%;border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:14px;background:white;">
              <option value="16">16-bit</option>
              <option value="12">12-bit</option>
            </select>
          </div>
        </div>

        <div class="button-row">
          <button id="decode-button" type="button">Decode waveforms</button>
          <button id="save-separate-raw" type="button" class="secondary" disabled>Save separate raw ZIP</button>
          <button id="save-separate-wavs" type="button" class="secondary" disabled>Save separate WAVs ZIP</button>
          <button id="save-combined-wav" type="button" class="secondary" disabled>Save combined WAV</button>
          <button id="save-header" type="button" class="secondary" disabled>Save C++ header</button>
          <button id="save-chart" type="button" class="secondary" disabled>Save chart HTML</button>
        </div>

        <p id="status" class="status">Select either the two ROM files or a VS-WAVES.DAT file to begin.</p>
        <div id="results" class="results"></div>
      </div>
    </div>

    <script src="node_modules/fflate/umd/index.js"></script>
    <script src="browserDecoderUi.js"></script>
  </body>
</html>
